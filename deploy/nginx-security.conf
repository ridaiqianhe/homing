# Include in the HTTPS server block managed in front of ddns-panel.
# Cloudflare should be configured to connect to the origin using Full (strict).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Do not put secrets in query strings. get-cert.sh sends Authorization instead.
# The application should reject query-string credentials after migration.
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


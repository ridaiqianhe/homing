<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token|default('') }}">
<title>{% block title %}{{ t('page_title') }}{% endblock %} · {{ site_name }}</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ddns-theme')||'';}catch(e){}</script>
<style>
  :root {
    --bg:#eef1f6; --panel:#fff; --panel-2:#f7f9fc; --border:#e0e5ee; --border-strong:#cfd6e2;
    --text:#18202e; --muted:#5c6675; --faint:#8b94a3; --accent:#3257ff; --accent-ink:#2440cc;
    --accent-weak:rgba(50,87,255,.09); --good:#12854a; --good-bg:rgba(18,133,74,.12);
    --warn:#9a6a12; --warn-bg:rgba(197,140,24,.15); --crit:#c8383a; --crit-bg:rgba(200,56,58,.12);
    --shadow:0 1px 2px rgba(20,30,50,.04),0 6px 20px rgba(20,30,50,.06);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif; --r:12px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0e14;--panel:#141922;--panel-2:#1a212c;--border:#252d3a;--border-strong:#323c4d;
    --text:#e7edf5;--muted:#9aa4b4;--faint:#6a7383;--accent:#6e8bff;--accent-ink:#8ba3ff;
    --accent-weak:rgba(110,139,255,.13);--good:#46c07a;--good-bg:rgba(70,192,122,.14);
    --warn:#e0a730;--warn-bg:rgba(224,167,48,.15);--crit:#ff6b6d;--crit-bg:rgba(255,107,109,.13);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);}}
  :root[data-theme="light"]{--bg:#eef1f6;--panel:#fff;--panel-2:#f7f9fc;--border:#e0e5ee;--border-strong:#cfd6e2;--text:#18202e;--muted:#5c6675;--faint:#8b94a3;--accent:#3257ff;--accent-ink:#2440cc;--accent-weak:rgba(50,87,255,.09);--good:#12854a;--good-bg:rgba(18,133,74,.12);--warn:#9a6a12;--warn-bg:rgba(197,140,24,.15);--crit:#c8383a;--crit-bg:rgba(200,56,58,.12);--shadow:0 1px 2px rgba(20,30,50,.04),0 6px 20px rgba(20,30,50,.06);}
  :root[data-theme="dark"]{--bg:#0b0e14;--panel:#141922;--panel-2:#1a212c;--border:#252d3a;--border-strong:#323c4d;--text:#e7edf5;--muted:#9aa4b4;--faint:#6a7383;--accent:#6e8bff;--accent-ink:#8ba3ff;--accent-weak:rgba(110,139,255,.13);--good:#46c07a;--good-bg:rgba(70,192,122,.14);--warn:#e0a730;--warn-bg:rgba(224,167,48,.15);--crit:#ff6b6d;--crit-bg:rgba(255,107,109,.13);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-ink);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 64px;}
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
  .bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
  .mark{width:34px;height:34px;border-radius:9px;flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));display:grid;place-items:center;box-shadow:var(--shadow);}
  .mark svg{width:19px;height:19px;display:block;}
  .brand{display:flex;flex-direction:column;line-height:1.15;}
  .brand b{font-size:15px;letter-spacing:-.01em;font-family:var(--mono);}
  .brand span{font-size:11.5px;color:var(--muted);}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--accent-weak);color:var(--accent-ink);letter-spacing:.02em;}
  .spacer{flex:1;}
  .iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;}
  .iconbtn:hover{border-color:var(--border-strong);color:var(--text);}
  .btn{border:1px solid transparent;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:7px;text-decoration:none;}
  .btn:hover{background:var(--accent-ink);}
  .btn.ghost{background:var(--panel);color:var(--text);border-color:var(--border-strong);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink);}
  .btn.danger{background:var(--crit-bg);color:var(--crit);}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px;}
  h1.page{font-size:22px;letter-spacing:-.02em;margin:30px 0 4px;text-wrap:balance;}
  .lede{color:var(--muted);font-size:14px;margin:0 0 24px;max-width:62ch;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);}
  .tile .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .tile .v{font-size:26px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .tile .v small{font-size:14px;color:var(--faint);font-weight:500;}
  .tile .sub{font-size:12px;color:var(--faint);margin-top:2px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:5px;}
  .dot.good{background:var(--good);box-shadow:0 0 0 3px var(--good-bg);}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;}
  .sec-head h2{font-size:15px;margin:0;letter-spacing:-.01em;}
  .sec-head .count{font-size:12px;color:var(--faint);font-family:var(--mono);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
  .tablescroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:720px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--panel-2);}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}
  .host{font-family:var(--mono);font-size:13px;font-weight:600;}
  .host .z{color:var(--faint);font-weight:400;}
  .host .lbl{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .ip{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;}
  .ip.none{color:var(--faint);}
  .when{color:var(--muted);font-size:12.5px;white-space:nowrap;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.pending{background:var(--panel-2);color:var(--faint);border:1px solid var(--border);}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .line{font-size:12px;color:var(--muted);font-family:var(--mono);}
  .line.proxied{color:var(--accent-ink);}
  .line .muted{color:var(--faint);}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end;}
  .mini{border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;height:28px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-family:var(--sans);}
  .mini:hover{border-color:var(--accent);color:var(--accent-ink);}
  .mini svg{width:13px;height:13px;}
  .mini{white-space:nowrap;flex-shrink:0;}
  .mini.danger:hover{border-color:var(--crit);color:var(--crit);}
  /* modal */
  dialog{border:none;border-radius:16px;padding:0;background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:520px;width:calc(100% - 40px);}
  dialog::backdrop{background:rgba(10,14,22,.55);backdrop-filter:blur(3px);}
  .mhead{padding:18px 20px 0;}
  .mhead h3{margin:0 0 3px;font-size:16px;letter-spacing:-.01em;}
  .mhead p{margin:0;font-size:12.5px;color:var(--muted);}
  .mbody{padding:16px 20px;}
  .mform label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em;}
  .mform input[type=text],.mform input[type=number],.mform input[type=password],.mform select{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--panel-2);color:var(--text);font-family:var(--mono);font-size:13.5px;line-height:1.3;}
  .mform input::placeholder{color:var(--faint);}
  .mform input:focus,.mform select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
  .checkrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--text);}
  .checkrow input{width:16px;height:16px;accent-color:var(--accent);}
  .mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--panel-2);}
  .clienttabs{display:flex;gap:4px;margin-bottom:12px;}
  .ctab{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);border:1px solid transparent;background:transparent;}
  .ctab.on{background:var(--accent-weak);color:var(--accent-ink);}
  .code{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:12px 13px;font-family:var(--mono);font-size:12px;color:var(--text);overflow-x:auto;position:relative;line-height:1.7;white-space:pre-wrap;word-break:break-all;}
  .code .c{color:var(--faint);} .code .t{color:var(--accent-ink);} .code .s{color:var(--good);}
  .code+.code{margin-top:10px;}
  .copyabs{position:absolute;top:8px;right:8px;border:1px solid var(--border-strong);background:var(--panel);color:var(--muted);font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-weight:600;}
  .copyabs:hover{color:var(--accent-ink);border-color:var(--accent);}
  .keyline{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-top:6px;}
  .keyline code{font-family:var(--mono);font-size:12.5px;flex:1;word-break:break-all;}
  .secret{filter:blur(5px);user-select:none;transition:filter .16s;}
  .secret.revealed{filter:none;user-select:text;}
  .field-action{position:relative;}
  .field-action input{padding-right:46px!important;}
  .field-action .iconbtn{position:absolute;right:5px;top:5px;width:32px;height:32px;background:transparent;}
  .host-compose{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(150px,1fr);align-items:center;gap:8px;}
  .host-compose .join{font-family:var(--mono);color:var(--faint);font-weight:700;}
  .host-preview{margin-top:8px;padding:8px 10px;border:1px dashed var(--border-strong);border-radius:8px;color:var(--muted);font-size:12px;overflow-wrap:anywhere;}
  .host-preview b{font-family:var(--mono);color:var(--accent-ink);}
  .note{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.6;}
  #certHelp{max-width:680px;max-height:calc(100dvh - 32px);border-radius:8px;}
  #certHelp .host{overflow-wrap:anywhere;}
  #certHelp label{letter-spacing:0;text-transform:none;}
  .cert-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .cert-generate{margin:16px 0;}
  .cert-error{color:var(--crit);font-size:13px;overflow-wrap:anywhere;}
  #cert-command-code{max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;border-radius:8px;}
  .cert-clients-head{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;font-weight:600;}
  .cert-clients{margin:8px 0 0;padding:0;list-style:none;}
  .cert-clients li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;font-size:13px;border-bottom:1px solid var(--border);}
  .cert-clients li:last-child{border-bottom:0;}
  .cert-clients li>span{min-width:0;overflow-wrap:anywhere;}
  .cert-clients small{display:block;color:var(--faint);font-size:11px;}
  .cert-clients .muted{color:var(--faint);}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);}
  .empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:10px;}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap;}
  /* 终端流式视图 */
  dialog.term-dialog{max-width:720px;}
  .term-top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);}
  .term-dots{display:flex;gap:6px;}
  .term-dots i{width:11px;height:11px;border-radius:50%;display:block;}
  .term-dots i:nth-child(1){background:#ff5f56;} .term-dots i:nth-child(2){background:#ffbd2e;} .term-dots i:nth-child(3){background:#27c93f;}
  .term-title{font-family:var(--mono);font-size:12.5px;color:var(--muted);}
  .term-badge{margin-left:auto;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
  .term-badge.run{background:var(--warn-bg);color:var(--warn);}
  .term-badge.ok{background:var(--good-bg);color:var(--good);}
  .term-badge.err{background:var(--crit-bg);color:var(--crit);}
  .term-body{background:#0a0d13;color:#c9d4e3;font-family:var(--mono);font-size:12.5px;line-height:1.65;
    padding:16px 18px;height:min(56vh,440px);overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
  .term-body .l{display:block;}
  .term-body .prompt{color:#6ee7a8;} .term-body .step{color:#7db5ff;} .term-body .okl{color:#5ee08a;} .term-body .errl{color:#ff8a8a;}
  .term-caret{display:inline-block;width:8px;height:15px;background:#6ee7a8;vertical-align:-2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;box-shadow:var(--shadow);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ---- 动画 ---- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes pop{from{opacity:0;transform:scale(.95) translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 var(--good-bg);}50%{box-shadow:0 0 0 4px var(--good-bg);}}
  .btn,.mini,.iconbtn,.ctab,.copyabs{transition:background .16s,border-color .16s,color .16s,transform .1s,box-shadow .16s;}
  .btn:active,.mini:active,.iconbtn:active,.copyabs:active{transform:translateY(1px) scale(.985);}
  .tile{transition:transform .18s ease,box-shadow .18s ease;animation:fadeUp .45s ease backwards;}
  .tile:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(20,30,50,.09),0 12px 30px rgba(20,30,50,.08);}
  .stats .tile:nth-child(1){animation-delay:.03s;} .stats .tile:nth-child(2){animation-delay:.08s;}
  .stats .tile:nth-child(3){animation-delay:.13s;} .stats .tile:nth-child(4){animation-delay:.18s;}
  .card{animation:fadeUp .5s ease backwards;animation-delay:.12s;}
  tbody tr{animation:fadeUp .4s ease backwards;}
  tbody tr:nth-child(1){animation-delay:.05s;} tbody tr:nth-child(2){animation-delay:.10s;}
  tbody tr:nth-child(3){animation-delay:.15s;} tbody tr:nth-child(4){animation-delay:.20s;}
  tbody tr:nth-child(5){animation-delay:.25s;} tbody tr:nth-child(n+6){animation-delay:.30s;}
  tbody td,tbody tr{transition:background .14s ease;}
  dialog[open]{animation:pop .2s cubic-bezier(.2,.8,.3,1);}
  dialog[open]::backdrop{animation:fadeIn .22s ease;}
  .pill.good .d{animation:pulseDot 2.4s ease-in-out infinite;}
  .row-flash{animation:flashOk 1.2s ease;}
  @keyframes flashOk{0%{background:var(--good-bg);}100%{background:transparent;}}
  .spinner{width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;}
  .vstat{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:opacity .2s;}
  .vstat.ok{color:var(--good);} .vstat.bad{color:var(--crit);} .vstat.run{color:var(--muted);}
  @media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){
    #host-table{min-width:0;}
    #host-table thead{display:none;}
    #host-table tbody tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:14px;border-bottom:1px solid var(--border);}
    #host-table tbody tr:last-child{border-bottom:0;}
    #host-table td{min-width:0;padding:0;border:0;overflow-wrap:anywhere;}
    #host-table td:first-child,#host-table td:last-child{grid-column:1/-1;}
    #host-table .rowbtns{flex-wrap:wrap;justify-content:flex-start;margin-top:4px;}
    #host-table .vstat:empty{display:none;}
  }
  @media (max-width:520px){.wrap{padding-inline:12px}.bar{padding-inline:12px;gap:8px}.tag{display:none}.host-compose{grid-template-columns:minmax(0,1fr) auto}.host-compose select{grid-column:1/-1}.rowbtns{flex-wrap:wrap}.mfoot{padding-inline:14px}.mbody{padding-inline:14px}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
{% block body %}{% endblock %}
<div id="toast"></div>
<script>
  let T = {{ js_i18n|tojson }};
  const ALL_T = {{ all_i18n|default({})|tojson }};
  function tt(k, o){ let s = T[k] || k; if(o){ for(const x in o) s = s.replace('{'+x+'}', o[x]); } return s; }
  const root=document.documentElement,tbtn=document.getElementById('theme');
  if(!root.dataset.theme)root.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  if(tbtn)tbtn.addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('ddns-theme',next);}catch(e){}});
  let tmo;const toast=document.getElementById('toast');
  function pop(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tmo);tmo=setTimeout(()=>toast.classList.remove('show'),1400);}
  document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c){navigator.clipboard?.writeText(c.getAttribute('data-copy'));pop(T.js_copied);}});
  const csrf=document.querySelector('meta[name="csrf-token"]')?.content||'';
  document.querySelectorAll('form[method="post" i]').forEach(f=>{if(!f.querySelector('input[name="csrf_token"]')){const i=document.createElement('input');i.type='hidden';i.name='csrf_token';i.value=csrf;f.prepend(i);}});
  const nativeFetch=window.fetch.bind(window);
  window.fetch=(input,init={})=>{const method=(init.method||'GET').toUpperCase();if(!['GET','HEAD','OPTIONS'].includes(method)&&csrf){init.headers=new Headers(init.headers||{});init.headers.set('X-CSRF-Token',csrf);}return nativeFetch(input,init);};
  function swapLanguage(next, href){
    const from=document.documentElement.lang==='zh'?'zh':'en', dict=ALL_T[next];
    if(!dict||!ALL_T[from]){location.href=href;return;}
    const pairs=Object.keys(dict).map(k=>[ALL_T[from][k],dict[k]]).filter(x=>x[0]&&x[1]).sort((a,b)=>b[0].length-a[0].length);
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
    while(n=walker.nextNode()){if(n.parentElement?.closest('script,style,code,.code,.ip,.host,[data-no-translate]'))continue;let v=n.nodeValue;pairs.forEach(([a,b])=>{v=v.split(a).join(b)});n.nodeValue=v;}
    document.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>['title','aria-label','placeholder'].forEach(a=>{if(el.hasAttribute(a)){let v=el.getAttribute(a);pairs.forEach(([x,y])=>{v=v.split(x).join(y)});el.setAttribute(a,v);}}));
